<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUARTER Analytics – Logowanie</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>QUARTER Analytics</h1>
    <p>Połącz konto Allegro aby rozpocząć.</p>

    {% if auth_flow is none %}
      <!-- Step 1: initiate device flow -->
      <form method="post" action="/auth/start">
        <button type="submit" class="btn btn-primary">Połącz z Allegro</button>
      </form>

    {% else %}
      <!-- Step 2: show verification link + poll -->
      {% set uri = auth_flow.get("verification_uri_complete") or auth_flow.get("verification_uri") %}
      <div class="auth-link-box">
        <a href="{{ uri }}" target="_blank" rel="noopener">{{ uri }}</a>
      </div>
      <p style="font-size:13px;color:#aaa;margin-bottom:1rem">
        Otwórz powyższy link i zatwierdź dostęp, a następnie kliknij poniżej.
      </p>
      <form method="post" action="/auth/poll">
        <button type="submit" class="btn btn-primary">Już autoryzowałem</button>
      </form>
    {% endif %}
  </div>
</div>
</body>
</html>
